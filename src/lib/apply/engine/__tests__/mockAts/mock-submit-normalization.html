<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mock ATS – Submit Normalization</title>
</head>
<body>
  <form id="application-form">
    <div>
      <label for="first_name">First Name*</label>
      <input id="first_name" name="first_name" type="text" required>
    </div>

    <!-- Phone Country Combobox: options are "Country DialCode" -->
    <div>
      <label for="country">Country*</label>
      <input id="country" role="combobox" class="select__input" type="text" required autocomplete="off" aria-controls="country-listbox">
      <ul id="country-listbox" role="listbox"></ul>
    </div>

    <!-- Phone input -->
    <div>
      <label for="phone">Phone*</label>
      <input id="phone" name="phone" type="tel" required>
    </div>

    <!-- Location Combobox: options are "City, State, Country" -->
    <div>
      <label for="candidate-location">Location (City)*</label>
      <input id="candidate-location" role="combobox" class="select__input" type="text" required autocomplete="off" aria-controls="location-listbox">
      <ul id="location-listbox" role="listbox"></ul>
    </div>

    <!-- Sponsorship Combobox: options are "Yes" / "No" -->
    <div>
      <label for="sponsorship">Sponsorship*</label>
      <input id="sponsorship" role="combobox" class="select__input" type="text" required autocomplete="off" aria-controls="sponsorship-listbox">
      <ul id="sponsorship-listbox" role="listbox"></ul>
    </div>

    <!-- Custom DW Role Combobox: exact employer options -->
    <div>
      <label for="dw-role">Primary Data Warehouse Role*</label>
      <input id="dw-role" role="combobox" class="select__input" type="text" required autocomplete="off" aria-controls="dw-role-listbox">
      <ul id="dw-role-listbox" role="listbox"></ul>
    </div>

    <button id="submit_application" type="submit">Submit Application</button>
  </form>

  <div id="confirmation-message" style="display: none;">
    Application submitted. Thank you for applying!
  </div>

  <script>
    function setupCombobox(inputId, listboxId, options) {
      var input = document.getElementById(inputId);
      var listbox = document.getElementById(listboxId);
      if (!input || !listbox) return;

      function render() {
        listbox.innerHTML = "";
        for (var i = 0; i < options.length; i++) {
          var li = document.createElement("li");
          li.setAttribute("role", "option");
          li.textContent = options[i];
          (function(val) {
            li.addEventListener("click", function() {
              input.value = val.trim();
              listbox.innerHTML = "";
            });
          })(options[i]);
          listbox.appendChild(li);
        }
      }

      input.addEventListener("click", render);
      input.addEventListener("focus", render);
      input.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
          listbox.innerHTML = "";
        }
      });
      input.addEventListener("blur", function() {
        setTimeout(function() {
          listbox.innerHTML = "";
        }, 100);
      });
    }

    setupCombobox("country", "country-listbox", [
      "United States +1",
      "Canada +1",
      "United Kingdom +44",
      "India +91"
    ]);

    setupCombobox("candidate-location", "location-listbox", [
      "Dallas, Texas, United States",
      "Dallas, Georgia, United States",
      "Austin, Texas, United States"
    ]);

    setupCombobox("sponsorship", "sponsorship-listbox", [
      "Yes",
      "No"
    ]);

    setupCombobox("dw-role", "dw-role-listbox", [
      "Architect",
      "Lead Developer",
      "Senior Developer"
    ]);

    document.getElementById("application-form").addEventListener("submit", function(e) {
      e.preventDefault();
      document.getElementById("application-form").style.display = "none";
      document.getElementById("confirmation-message").style.display = "block";
    });
  </script>
</body>
</html>
